<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="pointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0A0F16"/>

  <!-- Subtle grid texture -->
  <g stroke="#1B2534" stroke-width="1" opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- ICON: hexagon network hub -->
  <g transform="translate(160,160)">
    <!-- glow -->
    <circle cx="0" cy="0" r="110" fill="url(#nodeGlow)" opacity="0.5"/>
    <!-- hexagon outline -->
    <path d="M0,-92 L79.7,-46 L79.7,46 L0,92 L-79.7,46 L-79.7,-46 Z"
          fill="none" stroke="url(#pointGrad)" stroke-width="7" stroke-linejoin="round"/>
    <!-- connection lines: big node to satellite nodes -->
    <g stroke="#3B82F6" stroke-width="3.5" opacity="0.85">
      <line x1="0" y1="0" x2="0" y2="-58"/>
      <line x1="0" y1="0" x2="50" y2="29"/>
      <line x1="0" y1="0" x2="-50" y2="29"/>
    </g>
    <!-- satellite nodes (the vendors) -->
    <circle cx="0" cy="-58" r="10" fill="#0A0F16" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="50" cy="29" r="10" fill="#0A0F16" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="-50" cy="29" r="10" fill="#0A0F16" stroke="#38BDF8" stroke-width="4"/>
    <!-- THE POINT: central hub node -->
    <circle cx="0" cy="0" r="17" fill="url(#pointGrad)" filter="url(#softGlow)"/>
  </g>

  <!-- WORDMARK -->
  <g font-family="'Segoe UI', 'Inter', Arial, sans-serif">
    <text x="310" y="192" font-size="118" font-weight="700" letter-spacing="-2">
      <tspan fill="#F2F6FB">AVL</tspan><tspan fill="url(#pointGrad)">point</tspan>
    </text>
    <!-- tagline -->
    <text x="316" y="248" font-size="27" font-weight="400" letter-spacing="10" fill="#7C8AA0" font-family="'Consolas','JetBrains Mono',monospace">EVERY VENDOR. VERIFIED. ONE POINT.</text>
  </g>
</svg>
