<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bpg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="grn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="#0A0F16"/>
  <text x="60" y="70" font-family="'Consolas','JetBrains Mono',monospace" font-size="22" letter-spacing="8" fill="#7C8AA0">AVLPOINT TRUST LADDER — BADGE SET</text>

  <!-- ===== TIER 0: LISTED ===== -->
  <g transform="translate(60,120)">
    <rect width="240" height="64" rx="32" fill="#111826" stroke="#3E4C61" stroke-width="2"/>
    <g transform="translate(36,32)">
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" fill="none" stroke="#7C8AA0" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#7C8AA0"/>
    </g>
    <text x="72" y="40" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="24" font-weight="600" fill="#B9C4D4">Listed</text>
    <text x="0" y="100" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="17" fill="#7C8AA0">In the database. Unclaimed.</text>
  </g>

  <!-- ===== TIER 1: CLAIMED ===== -->
  <g transform="translate(360,120)">
    <rect width="240" height="64" rx="32" fill="#111826" stroke="#3B82F6" stroke-width="2"/>
    <g transform="translate(36,32)">
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" fill="none" stroke="#3B82F6" stroke-width="3"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#38BDF8" stroke-width="3"/>
    </g>
    <text x="72" y="40" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="24" font-weight="600" fill="#E7EEF7">Claimed</text>
    <text x="0" y="100" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="17" fill="#7C8AA0">Owner-managed profile.</text>
  </g>

  <!-- ===== TIER 2: VERIFIED ===== -->
  <g transform="translate(660,120)">
    <rect width="240" height="64" rx="32" fill="#0E1B30" stroke="url(#bpg)" stroke-width="2.5"/>
    <g transform="translate(36,32)">
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" fill="none" stroke="url(#bpg)" stroke-width="3"/>
      <circle cx="0" cy="0" r="7" fill="url(#bpg)"/>
    </g>
    <text x="72" y="40" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="24" font-weight="600" fill="#E7EEF7">Verified</text>
    <text x="0" y="100" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="17" fill="#7C8AA0">Docs &amp; certs checked at source.</text>
  </g>

  <!-- ===== TIER 3: LEVEL 1 CERTIFIED ===== -->
  <g transform="translate(60,300)">
    <rect width="380" height="64" rx="32" fill="#0B211B" stroke="url(#grn)" stroke-width="2.5"/>
    <g transform="translate(36,32)">
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" fill="none" stroke="url(#grn)" stroke-width="3"/>
      <path d="M-6,0 L-2,5 L7,-6" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="72" y="40" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="24" font-weight="600" fill="#DCFCE9">Level 1 Certified</text>
    <text x="0" y="100" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="17" fill="#7C8AA0">Passed independent on-site inspection. Expiry-dated.</text>
  </g>

  <!-- ===== EMBED BADGE (for vendor websites) ===== -->
  <g transform="translate(540,300)">
    <rect width="420" height="120" rx="16" fill="#111826" stroke="#1B2534" stroke-width="2"/>
    <g transform="translate(56,60)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" fill="none" stroke="url(#grn)" stroke-width="4"/>
      <path d="M-10,0 L-3,8 L12,-10" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="110" y="52" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="21" font-weight="700" fill="#E7EEF7">AVLpoint Certified</text>
    <text x="110" y="80" font-family="'Consolas','JetBrains Mono',monospace" font-size="15" fill="#7C8AA0">LEVEL 1 · INSPECTED 2026</text>
    <text x="0" y="150" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="17" fill="#7C8AA0">Embeddable site badge — free advertising on every certified vendor's website.</text>
  </g>

  <!-- ===== COLOR TOKENS ===== -->
  <g transform="translate(60,500)" font-family="'Consolas','JetBrains Mono',monospace" font-size="15" fill="#7C8AA0">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="#0A0F16" stroke="#1B2534"/><text x="0" y="68">#0A0F16 VOID</text>
    <rect x="190" y="0" width="44" height="44" rx="8" fill="#111826"/><text x="190" y="68">#111826 PANEL</text>
    <rect x="380" y="0" width="44" height="44" rx="8" fill="#3B82F6"/><text x="380" y="68">#3B82F6 SIGNAL</text>
    <rect x="570" y="0" width="44" height="44" rx="8" fill="#38BDF8"/><text x="570" y="68">#38BDF8 PULSE</text>
    <rect x="760" y="0" width="44" height="44" rx="8" fill="#10B981"/><text x="760" y="68">#10B981 CERTIFIED</text>
    <rect x="950" y="0" width="44" height="44" rx="8" fill="#F2F6FB"/><text x="950" y="68">#F2F6FB TEXT</text>
  </g>
</svg>
