<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect width="512" height="512" rx="104" fill="#0A0F16"/>
  <!-- faint grid -->
  <g stroke="#1B2534" stroke-width="2" opacity="0.4">
    <line x1="0" y1="171" x2="512" y2="171"/>
    <line x1="0" y1="341" x2="512" y2="341"/>
    <line x1="171" y1="0" x2="171" y2="512"/>
    <line x1="341" y1="0" x2="341" y2="512"/>
  </g>

  <g transform="translate(256,256)">
    <circle cx="0" cy="0" r="190" fill="url(#glow)" opacity="0.5"/>
    <!-- hexagon -->
    <path d="M0,-158 L136.8,-79 L136.8,79 L0,158 L-136.8,79 L-136.8,-79 Z"
          fill="none" stroke="url(#pg)" stroke-width="13" stroke-linejoin="round"/>
    <!-- spokes -->
    <g stroke="#3B82F6" stroke-width="6.5" opacity="0.85">
      <line x1="0" y1="0" x2="0" y2="-100"/>
      <line x1="0" y1="0" x2="86" y2="50"/>
      <line x1="0" y1="0" x2="-86" y2="50"/>
    </g>
    <!-- satellite nodes -->
    <circle cx="0" cy="-100" r="17" fill="#0A0F16" stroke="#38BDF8" stroke-width="7"/>
    <circle cx="86" cy="50" r="17" fill="#0A0F16" stroke="#38BDF8" stroke-width="7"/>
    <circle cx="-86" cy="50" r="17" fill="#0A0F16" stroke="#38BDF8" stroke-width="7"/>
    <!-- hub point -->
    <circle cx="0" cy="0" r="30" fill="url(#pg)" filter="url(#sg)"/>
  </g>
</svg>
